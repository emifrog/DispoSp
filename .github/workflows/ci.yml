name: CI

on:
  push:
    branches: [main]
  pull_request:

# Europe/Paris is the reference timezone of the application; pinning it here
# keeps CI runs comparable with developer machines.
env:
  TZ: Europe/Paris

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests unitaires et schéma PostgreSQL
        run: pnpm test

      - name: Build de production
        run: pnpm build

      # The Playwright config starts `next start` against the build above.
      - name: Navigateur de test
        run: pnpm exec playwright install --with-deps chromium

      # Aucune coordonnée Supabase n'est fournie ici, et c'est délibéré : ce
      # travail vérifie que la surface publique — manifeste, agent de service,
      # page hors ligne, écran de connexion — se sert sans aucun accès à la
      # base. Les parcours qui demandent une session se sautent d'eux-mêmes.
      #
      # Cela n'a pas toujours été vrai : le garde de session exigeait la
      # configuration avant même de regarder le chemin demandé, si bien que
      # même le manifeste échouait ici. `tests/middleware.test.ts` garde
      # désormais cette propriété, et échoue si elle se reperd.
      - name: Tests de bout en bout — surface publique, sans base
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
